name: Bug Report
description: Report a bug in MailPong
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, follow SECURITY.md. Remove credentials and private mail data from reports. If you are not sure whether the bug is in MailPong or in upstream Aerion, report it here; do not file MailPong issues with Aerion.
  - type: input
    id: version
    attributes:
      label: MailPong version or commit
      description: Include the commit hash for custom builds.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and version, architecture, build or install method, and WebKitGTK version if relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include sanitized logs or screenshots and whether this reproduces upstream, if known.
