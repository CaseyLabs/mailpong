name: Feature Request
description: Describe the problem and the feature you want.
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem and the feature you want.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the MailPong commit, platform, examples, or alternatives when relevant. Remove credentials and private mail data.
