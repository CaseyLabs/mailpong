name: Release

# Tag pushes (v*) build every platform and create a DRAFT prerelease for
# manual review. Nothing is published automatically, and no step pushes to a
# branch. Run it by hand (Actions > Release > Run workflow) for a dry run that
# only uploads workflow artifacts.
on:
  push:
    tags: 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build everything, upload workflow artifacts only, no release'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Tag name on a release, "dry-run" on a manual run. Used in artifact names.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: arm64
    runs-on: ${{ matrix.os }}
    # Release builds ship no OAuth credentials (users bring their own); the
    # Makefile only warns when they are missing.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Windows dependencies (NSIS)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Wails detects NSIS via exec.LookPath("makensis") — make sure subsequent steps see it.
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          make build-linux

          # Keep the plain binary for the Flatpak job, then name the release copy
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            LINUX_ARCH=x86_64
          else
            LINUX_ARCH=aarch64
          fi
          cp build/bin/mailpong "build/bin/mailpong-${VERSION}-linux-${LINUX_ARCH}"
          mv build/bin/mailpong "build/bin/mailpong-binary-${{ matrix.arch }}.bin"

          # Create distribution tarball (complete package for manual installation)
          APP_ID=io.github.caseylabs.MailPong
          mkdir -p dist-package
          cp "build/bin/mailpong-${VERSION}-linux-${LINUX_ARCH}" dist-package/mailpong
          cp build/linux/install.sh build/linux/uninstall.sh dist-package/
          cp build/linux/${APP_ID}.desktop dist-package/
          # 256 at tarball root; sized copies + scalable SVG live under icons/
          # so install.sh can fill hicolor. Keep sizes in sync with ICON_SIZES
          # in Makefile/install.sh.
          cp build/linux/mailpong.png dist-package/${APP_ID}.png
          for sz in 32 48 64 128 256; do
            mkdir -p dist-package/icons/${sz}x${sz}
            cp build/linux/icons/${sz}x${sz}/${APP_ID}.png dist-package/icons/${sz}x${sz}/
          done
          mkdir -p dist-package/icons/scalable
          cp build/linux/icons/scalable/${APP_ID}.svg dist-package/icons/scalable/
          cp LICENSE dist-package/
          cp NOTICE THIRD_PARTY_NOTICES.md dist-package/

          tar czf "mailpong-linux-${{ matrix.arch }}.tar.gz" -C dist-package .
          rm -rf dist-package

      - name: Build (macOS)
        if: matrix.platform == 'darwin'
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          make build
          cd build/bin
          zip -r MailPong-darwin-${{ matrix.arch }}.zip MailPong.app
          rm -rf MailPong.app

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          make build-windows-installer
          Move-Item build/bin/mailpong.exe build/bin/MailPong-windows-${{ matrix.arch }}.exe
          Move-Item build/bin/mailpong-${{ matrix.arch }}-installer.exe build/bin/MailPong-windows-setup-${{ matrix.arch }}.exe

      - uses: actions/upload-artifact@v7
        with:
          name: mailpong-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/bin/mailpong-*
            build/bin/MailPong-*
            mailpong-*.tar.gz
          retention-days: 7

  build-flatpak:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            go_arch: amd64
          - os: ubuntu-24.04-arm
            arch: aarch64
            go_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download the Linux binary built by this run
        uses: actions/download-artifact@v7
        with:
          name: mailpong-linux-${{ matrix.go_arch }}
          path: linux-build

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Primary: normal install (phased-updates opt-in is CI hygiene —
          # runners aren't a user population).
          # Fallback: EXACT noble release-pocket versions. Ubuntu can leave
          # -updates/-security unsatisfiable after pulling a bad update
          # (2026-09-17: bubblewrap 0.9.0-1ubuntu0.2 published + deleted
          # same day WITHOUT restoring ubuntu0.1, while updates-flatpak
          # depends on >= ubuntu0.1 — broke apt-install of flatpak on all
          # arches until mirrors carried the redone 0.9.0-1ubuntu0.3).
          # The release pocket is frozen and never deleted, and its
          # versions interlock by definition, so this set always installs
          # (verified co-installable). NOT -t noble: Default-Release
          # matches by codename too, so all noble-* pockets get pinned and
          # the broken updates candidate still wins. Versions are
          # noble-specific — refresh if the runner image moves off 24.04.
          sudo apt-get install -y -o APT::Get::Always-Include-Phased-Updates=true flatpak flatpak-builder \
            || sudo apt-get install -y flatpak=1.14.6-1 libflatpak0=1.14.6-1 bubblewrap=0.9.0-1build1 flatpak-builder=1.4.2-1build2

      - name: Add Flathub repository
        run: flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime and SDK
        run: |
          flatpak install -y --user flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50

      - name: Build Flatpak from this checkout
        run: |
          # The checkout manifest packages the binary built above, so it works
          # for dry runs and tags alike (no pinned tag or commit needed).
          mkdir -p build/bin
          cp linux-build/build/bin/mailpong-binary-${{ matrix.go_arch }}.bin build/bin/mailpong
          chmod +x build/bin/mailpong

          rm -rf .flatpak-builder
          flatpak-builder --user --force-clean --repo=repo \
            --install-deps-from=flathub \
            build-dir build/flatpak/io.github.caseylabs.MailPong-dev.yml

          flatpak build-bundle repo "build/bin/MailPong-${VERSION}-${{ matrix.arch }}.flatpak" io.github.caseylabs.MailPong

      - uses: actions/upload-artifact@v7
        with:
          name: mailpong-flatpak-${{ matrix.arch }}
          path: build/bin/MailPong-*.flatpak
          retention-days: 7

  release:
    # Only for a real tag. Creates a DRAFT prerelease; publishing is manual.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)
    needs: [build, build-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: mailpong-*
          merge-multiple: true

      - name: Create draft prerelease
        run: |
          # A re-run adds assets to the existing release instead of failing
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --draft --prerelease --verify-tag \
              --title "MailPong $TAG_NAME" \
              --notes "Draft. Review the assets, then publish manually. See CHANGELOG.md."
          fi

          # Skip the internal Flatpak input binary
          find artifacts -type f ! -name '*.bin' -print0 \
            | xargs -0 gh release upload "$TAG_NAME" --clobber
