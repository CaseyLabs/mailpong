app-id: io.github.caseylabs.MailPong
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node24
command: mailpong

finish-args:
  # Network access for email sync
  - --share=network
  # IPC is required for X11 and Wayland
  - --share=ipc
  # Display access
  - --socket=wayland
  - --socket=fallback-x11
  # GPU access for hardware acceleration
  - --device=dri
  # Sleep/wake detection for sync management
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: mailpong
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node24/bin
      env:
        GOROOT: /usr/lib/sdk/golang
        GOPATH: /run/build/mailpong/go
        GOCACHE: /run/build/mailpong/go-cache
        GO111MODULE: 'on'
        CGO_ENABLED: '1'
        npm_config_cache: /run/build/mailpong/flatpak-node/npm-cache
        npm_config_offline: 'true'

    build-commands:
      # Install frontend dependencies from offline cache
      - cd frontend && npm install --offline --legacy-peer-deps

      # Build frontend
      - cd frontend && npm run build

      # Build the Go binary using vendored modules. No OAuth credentials are
      # bundled (D3); users enter their own in Settings.
      # Tags: desktop (Wails runtime), webkit2_41 (GTK webkit API), production (embedded assets)
      - go build -mod=vendor -tags desktop,webkit2_41,production -ldflags "-w -s" -o mailpong

      # Install binary
      - install -Dm755 mailpong /app/bin/mailpong

      # Install desktop file with correct app ID
      - install -Dm644 build/linux/io.github.caseylabs.MailPong.desktop /app/share/applications/io.github.caseylabs.MailPong.desktop

      # Install themed icons with correct app ID (32-256 + scalable). A lone
      # 256 is skipped by hicolor MinSize=64 at small lookup sizes (#395).
      - |
        for sz in 32 48 64 128 256; do
          install -Dm644 "build/linux/icons/${sz}x${sz}/io.github.caseylabs.MailPong.png" \
            "/app/share/icons/hicolor/${sz}x${sz}/apps/io.github.caseylabs.MailPong.png"
        done
      - install -Dm644 build/linux/icons/scalable/io.github.caseylabs.MailPong.svg /app/share/icons/hicolor/scalable/apps/io.github.caseylabs.MailPong.svg

      # Install metainfo (AppStream metadata)
      - install -Dm644 build/flatpak/io.github.caseylabs.MailPong.metainfo.xml /app/share/metainfo/io.github.caseylabs.MailPong.metainfo.xml

    sources:
      # Application source code (tag and commit updated by calculate-hashes.sh)
      - type: git
        url: https://github.com/caseylabs/mailpong.git
        tag: v0.4.0
        commit: 0000000000000000000000000000000000000000  # set by calculate-hashes.sh at release

      # Go module vendoring (generated by flatpak-go-mod, offline)
      - go.mod.yml

      # npm package vendoring (generated by flatpak-node-generator, offline)
      - node-sources.json
